<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" shape-rendering="crispEdges">
  <!-- crystal extractor: crystal cluster held by a metal frame -->
  <!-- frame base -->
  <rect x="2" y="16" width="16" height="2" fill="#4a4a4a"/>
  <!-- frame arms -->
  <rect x="3" y="7" width="1" height="10" fill="#7e7e7e"/>
  <rect x="16" y="7" width="1" height="10" fill="#7e7e7e"/>
  <rect x="3" y="7" width="14" height="1" fill="#7e7e7e"/>
  <!-- crystals -->
  <polygon points="6,16 9,4 12,16" fill="#d8b4fe"/>
  <polygon points="6,16 9,4 9,16" fill="#a783d4"/>
  <polygon points="11,16 13,9 15,16" fill="#b4fef0"/>
  <polygon points="11,16 13,9 13,16" fill="#7fd8c0"/>
  <!-- shine -->
  <rect x="8" y="6" width="1" height="1" fill="#ffffff"/>
  <rect x="12" y="11" width="1" height="1" fill="#ffffff"/>
</svg>
