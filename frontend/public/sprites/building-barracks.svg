<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- barracks: crossed swords on red field -->
  <rect x="0" y="0" width="10" height="10" fill="#c62828"/>
  <!-- diagonal sword 1 (top-left → bottom-right) -->
  <rect x="1" y="1" width="1" height="1" fill="#e0e0e0"/>
  <rect x="2" y="2" width="1" height="1" fill="#e0e0e0"/>
  <rect x="3" y="3" width="1" height="1" fill="#e0e0e0"/>
  <rect x="4" y="4" width="1" height="1" fill="#e0e0e0"/>
  <rect x="5" y="5" width="1" height="1" fill="#e0e0e0"/>
  <rect x="6" y="6" width="1" height="1" fill="#e0e0e0"/>
  <rect x="7" y="7" width="1" height="1" fill="#e0e0e0"/>
  <rect x="8" y="8" width="1" height="1" fill="#8a5a1b"/>
  <!-- diagonal sword 2 (top-right → bottom-left) -->
  <rect x="8" y="1" width="1" height="1" fill="#e0e0e0"/>
  <rect x="7" y="2" width="1" height="1" fill="#e0e0e0"/>
  <rect x="6" y="3" width="1" height="1" fill="#e0e0e0"/>
  <rect x="5" y="4" width="1" height="1" fill="#e0e0e0"/>
  <rect x="4" y="5" width="1" height="1" fill="#e0e0e0"/>
  <rect x="3" y="6" width="1" height="1" fill="#e0e0e0"/>
  <rect x="2" y="7" width="1" height="1" fill="#e0e0e0"/>
  <rect x="1" y="8" width="1" height="1" fill="#8a5a1b"/>
</svg>
