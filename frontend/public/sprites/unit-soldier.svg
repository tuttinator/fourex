<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- soldier: helmeted infantry with sword + shield -->
  <!-- helm -->
  <rect x="13" y="5" width="6" height="4" fill="#9e9e9e"/>
  <rect x="12" y="6" width="1" height="3" fill="#757575"/>
  <rect x="19" y="6" width="1" height="3" fill="#757575"/>
  <rect x="15" y="9" width="2" height="1" fill="#000000"/>
  <!-- face slot -->
  <rect x="14" y="9" width="4" height="1" fill="#e8d6a5"/>
  <!-- breastplate -->
  <rect x="12" y="10" width="8" height="7" fill="#c62828"/>
  <rect x="13" y="11" width="6" height="1" fill="#ffeb3b"/>
  <!-- belt -->
  <rect x="12" y="17" width="8" height="1" fill="#4a1414"/>
  <!-- legs -->
  <rect x="12" y="18" width="3" height="6" fill="#616161"/>
  <rect x="17" y="18" width="3" height="6" fill="#616161"/>
  <!-- boots -->
  <rect x="11" y="24" width="4" height="2" fill="#1f1f1f"/>
  <rect x="17" y="24" width="4" height="2" fill="#1f1f1f"/>
  <!-- shield (left side) -->
  <rect x="7" y="12" width="5" height="7" fill="#ffc107"/>
  <rect x="8" y="13" width="3" height="5" fill="#c62828"/>
  <!-- sword -->
  <rect x="22" y="8" width="1" height="9" fill="#e0e0e0"/>
  <rect x="21" y="17" width="3" height="1" fill="#8a5a1b"/>
</svg>
