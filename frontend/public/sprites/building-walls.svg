<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- walls: crenellated stone battlement -->
  <rect x="0" y="3" width="10" height="7" fill="#9e9e9e"/>
  <!-- crenellations -->
  <rect x="0" y="1" width="2" height="2" fill="#9e9e9e"/>
  <rect x="4" y="1" width="2" height="2" fill="#9e9e9e"/>
  <rect x="8" y="1" width="2" height="2" fill="#9e9e9e"/>
  <!-- shading -->
  <rect x="0" y="9" width="10" height="1" fill="#616161"/>
  <rect x="0" y="3" width="10" height="1" fill="#bdbdbd"/>
  <!-- mortar lines -->
  <rect x="3" y="5" width="1" height="2" fill="#616161"/>
  <rect x="7" y="5" width="1" height="2" fill="#616161"/>
  <rect x="1" y="7" width="1" height="2" fill="#616161"/>
  <rect x="5" y="7" width="1" height="2" fill="#616161"/>
</svg>
