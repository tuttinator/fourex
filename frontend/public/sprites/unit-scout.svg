<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- scout: hooded runner silhouette -->
  <!-- hood / head -->
  <rect x="13" y="6" width="6" height="4" fill="#2e7d32"/>
  <rect x="14" y="5" width="4" height="1" fill="#2e7d32"/>
  <rect x="14" y="10" width="4" height="1" fill="#e8d6a5"/>
  <!-- cloak / torso -->
  <rect x="12" y="11" width="8" height="7" fill="#388e3c"/>
  <rect x="11" y="12" width="1" height="5" fill="#2e7d32"/>
  <rect x="20" y="12" width="1" height="5" fill="#2e7d32"/>
  <!-- belt -->
  <rect x="12" y="17" width="8" height="1" fill="#1b4d1b"/>
  <!-- legs mid-stride -->
  <rect x="12" y="18" width="3" height="6" fill="#4a3b2a"/>
  <rect x="17" y="18" width="3" height="5" fill="#4a3b2a"/>
  <!-- boots -->
  <rect x="11" y="24" width="4" height="2" fill="#1f1f1f"/>
  <rect x="17" y="23" width="4" height="2" fill="#1f1f1f"/>
  <!-- spyglass / staff -->
  <rect x="21" y="13" width="1" height="6" fill="#8a5a1b"/>
  <rect x="20" y="12" width="3" height="1" fill="#d4c48a"/>
</svg>
