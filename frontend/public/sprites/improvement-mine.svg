<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" shape-rendering="crispEdges">
  <!-- mine: entrance with crossed pickaxes -->
  <!-- mountain base -->
  <polygon points="0,18 10,4 20,18" fill="#6b6b6b"/>
  <polygon points="2,18 10,7 18,18" fill="#7e7e7e"/>
  <!-- mine entrance -->
  <rect x="8" y="12" width="4" height="6" fill="#1f1f1f"/>
  <rect x="7" y="11" width="6" height="1" fill="#4a2f14"/>
  <!-- pickaxe shaft (diagonal) -->
  <rect x="4" y="6" width="1" height="1" fill="#8a5a1b"/>
  <rect x="5" y="7" width="1" height="1" fill="#8a5a1b"/>
  <rect x="6" y="8" width="1" height="1" fill="#8a5a1b"/>
  <!-- pickaxe head -->
  <rect x="2" y="5" width="3" height="1" fill="#bdbdbd"/>
  <rect x="2" y="6" width="2" height="1" fill="#9e9e9e"/>
</svg>
