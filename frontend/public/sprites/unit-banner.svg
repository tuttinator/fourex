<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 32x32 transparent tile with a thick white border for per-player tinting. -->
  <!-- Drawn pure white so Pixi.tint multiplies the player colour cleanly -->
  <!-- without bleeding into other pixels. -->
  <!-- top edge -->
  <rect x="4" y="4" width="24" height="2" fill="#ffffff"/>
  <!-- bottom edge -->
  <rect x="4" y="26" width="24" height="2" fill="#ffffff"/>
  <!-- left edge -->
  <rect x="4" y="4" width="2" height="24" fill="#ffffff"/>
  <!-- right edge -->
  <rect x="26" y="4" width="2" height="24" fill="#ffffff"/>
</svg>
