<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- frontier outpost: single keep / watchtower -->
  <!-- tower shaft -->
  <rect x="13" y="10" width="6" height="14" fill="#9e8660"/>
  <rect x="13" y="10" width="1" height="14" fill="#7d6a4d"/>
  <rect x="18" y="10" width="1" height="14" fill="#7d6a4d"/>
  <!-- crenellated top -->
  <rect x="12" y="8" width="2" height="2" fill="#8b7555"/>
  <rect x="15" y="8" width="2" height="2" fill="#8b7555"/>
  <rect x="18" y="8" width="2" height="2" fill="#8b7555"/>
  <rect x="12" y="10" width="8" height="1" fill="#8b7555"/>
  <!-- door -->
  <rect x="15" y="18" width="2" height="6" fill="#4a2f14"/>
  <!-- windows -->
  <rect x="14" y="13" width="1" height="2" fill="#2a1f14"/>
  <rect x="17" y="13" width="1" height="2" fill="#2a1f14"/>
  <!-- ground base -->
  <rect x="11" y="24" width="10" height="1" fill="#5a432a"/>
