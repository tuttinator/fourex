<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- library: open book -->
  <rect x="0" y="2" width="10" height="7" fill="#1e3a8a"/>
  <!-- pages -->
  <rect x="1" y="3" width="4" height="5" fill="#f5f1e3"/>
  <rect x="5" y="3" width="4" height="5" fill="#f5f1e3"/>
  <!-- spine -->
  <rect x="4" y="2" width="2" height="7" fill="#0c1e52"/>
  <!-- lines of text -->
  <rect x="2" y="4" width="2" height="1" fill="#93c5fd"/>
  <rect x="2" y="6" width="2" height="1" fill="#93c5fd"/>
  <rect x="6" y="4" width="2" height="1" fill="#93c5fd"/>
  <rect x="6" y="6" width="2" height="1" fill="#93c5fd"/>
</svg>
