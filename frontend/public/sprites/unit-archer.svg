<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- archer: hooded ranger drawing a bow -->
  <!-- hood -->
  <rect x="13" y="5" width="6" height="4" fill="#6a1b9a"/>
  <rect x="14" y="4" width="4" height="1" fill="#6a1b9a"/>
  <!-- face -->
  <rect x="14" y="9" width="4" height="2" fill="#e8d6a5"/>
  <!-- tunic -->
  <rect x="12" y="11" width="8" height="6" fill="#8e24aa"/>
  <rect x="13" y="12" width="6" height="1" fill="#ba68c8"/>
  <!-- belt / quiver strap -->
  <rect x="12" y="17" width="8" height="1" fill="#4a148c"/>
  <!-- legs -->
  <rect x="12" y="18" width="3" height="6" fill="#4a3b2a"/>
  <rect x="17" y="18" width="3" height="6" fill="#4a3b2a"/>
  <!-- boots -->
  <rect x="11" y="24" width="4" height="2" fill="#1f1f1f"/>
  <rect x="17" y="24" width="4" height="2" fill="#1f1f1f"/>
  <!-- bow on left -->
  <rect x="7" y="9" width="1" height="12" fill="#8a5a1b"/>
  <rect x="8" y="8" width="1" height="1" fill="#8a5a1b"/>
  <rect x="8" y="21" width="1" height="1" fill="#8a5a1b"/>
  <!-- bowstring + arrow -->
  <rect x="9" y="9" width="1" height="12" fill="#e0e0e0"/>
  <rect x="10" y="14" width="12" height="1" fill="#8a5a1b"/>
  <rect x="22" y="14" width="1" height="1" fill="#9e9e9e"/>
</svg>
